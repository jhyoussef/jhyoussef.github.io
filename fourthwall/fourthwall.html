<style>
  #fw-gallery-root {
    --surface-strong: rgba(255, 250, 244, 0.96);
    --text: #261a12;
    --muted: #705a4d;
    --radius-lg: 8px;
    --radius-md: 8px;
    --tag: rgba(239, 228, 212, 0.7);
    --tag-active: #261a12;
    --tag-active-text: #fffaf3;
    box-sizing: border-box;
    width: min(1200px, 100%);
    margin: 0 auto;
    padding: 12px 0 56px;
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
  }

  #fw-gallery-root *,
  #fw-gallery-root *::before,
  #fw-gallery-root *::after {
    box-sizing: border-box;
  }

  #fw-gallery-root .fw-filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    margin: 0 0 22px;
  }

  #fw-gallery-root .fw-filter-chip {
    border: 0;
    border-radius: 0;
    padding: 0 0 2px;
    font: inherit;
    font-size: 0.95rem;
    color: var(--muted);
    background: transparent;
    cursor: pointer;
    transition: color 180ms ease, border-color 180ms ease;
  }

  #fw-gallery-root .fw-filter-chip:hover,
  #fw-gallery-root .fw-filter-chip:focus-visible {
    color: var(--text);
    outline: none;
  }

  #fw-gallery-root .fw-filter-chip.is-active {
    color: var(--text);
    border-bottom: 1px solid currentColor;
  }

  #fw-gallery-root .fw-gallery-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin: 0 2px 16px;
    color: var(--muted);
    font-size: 0.92rem;
  }

  #fw-gallery-root .fw-gallery {
    column-count: 1;
    column-gap: 16px;
  }

  #fw-gallery-root .fw-card {
    display: inline-block;
    position: relative;
    width: 100%;
    margin: 0 0 16px;
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: #14100d;
    box-shadow: 0 8px 22px rgba(49, 34, 18, 0.1);
    break-inside: avoid;
    transform: translateY(14px);
    opacity: 0;
    animation: fw-rise-in 500ms ease forwards;
  }

  #fw-gallery-root .fw-card-link {
    display: block;
    position: relative;
    color: inherit;
    text-decoration: none;
  }

  #fw-gallery-root .fw-card-media {
    display: block;
    width: 100%;
    height: auto;
    background: linear-gradient(180deg, rgba(238, 225, 211, 0.8), rgba(221, 204, 186, 0.9));
    transition: transform 220ms ease, filter 220ms ease;
  }

  #fw-gallery-root .fw-card-body {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 18px;
    color: #fffaf3;
    background: linear-gradient(to top, rgba(20, 13, 8, 0.86), rgba(20, 13, 8, 0.26) 54%, rgba(20, 13, 8, 0.05));
    opacity: 0;
    transition: opacity 200ms ease;
  }

  #fw-gallery-root .fw-card:hover .fw-card-body,
  #fw-gallery-root .fw-card:focus-within .fw-card-body {
    opacity: 1;
  }

  #fw-gallery-root .fw-card:hover .fw-card-media,
  #fw-gallery-root .fw-card:focus-within .fw-card-media {
    filter: saturate(0.92) brightness(0.82);
    transform: scale(1.015);
  }

  #fw-gallery-root .fw-card-title {
    margin: 0;
    color: inherit;
    font-size: 1.04rem;
    line-height: 1.25;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
  }

  #fw-gallery-root .fw-card-meta {
    margin: 6px 0 0;
    color: inherit;
    font-size: 0.84rem;
    line-height: 1.35;
    opacity: 0.9;
  }

  #fw-gallery-root .fw-card-caption {
    margin: 9px 0 0;
    color: inherit;
    font-size: 0.88rem;
    line-height: 1.35;
    opacity: 0.96;
  }

  #fw-gallery-root .fw-card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 12px 0 0;
  }

  #fw-gallery-root .fw-card-tag {
    color: inherit;
    font-size: 0.76rem;
    opacity: 0.84;
    text-transform: lowercase;
  }

  #fw-gallery-root .fw-card-featured {
    align-self: flex-start;
    margin: 0 0 8px;
    color: inherit;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    opacity: 0.82;
    text-transform: uppercase;
  }

  #fw-gallery-root .fw-empty-state {
    display: none;
    padding: 24px 20px;
    border: 1px dashed rgba(38, 26, 18, 0.2);
    border-radius: var(--radius-md);
    background: rgba(255, 251, 246, 0.65);
    color: var(--muted);
    text-align: center;
  }

  #fw-gallery-root .fw-empty-state.is-visible {
    display: block;
  }

  @keyframes fw-rise-in {
    from {
      opacity: 0;
      transform: translateY(14px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (min-width: 680px) {
    #fw-gallery-root .fw-gallery {
      column-count: 2;
    }
  }

  @media (min-width: 960px) {
    #fw-gallery-root .fw-gallery {
      column-count: 3;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #fw-gallery-root .fw-filter-chip,
    #fw-gallery-root .fw-card,
    #fw-gallery-root .fw-card-media,
    #fw-gallery-root .fw-card-body {
      transition: none;
      animation: none;
    }

    #fw-gallery-root .fw-card {
      opacity: 1;
      transform: none;
    }
  }

  @media (hover: none) {
    #fw-gallery-root .fw-card-body {
      position: static;
      color: var(--text);
      background: var(--surface-strong);
      opacity: 1;
    }

    #fw-gallery-root .fw-card-title,
    #fw-gallery-root .fw-card-meta,
    #fw-gallery-root .fw-card-caption,
    #fw-gallery-root .fw-card-tag,
    #fw-gallery-root .fw-card-featured {
      color: inherit;
      text-shadow: none;
    }
  }
</style>

<div id="fw-gallery-root">
  <div class="fw-filter-bar" id="fwFilterBar" aria-label="Gallery filters"></div>

  <div class="fw-gallery-meta">
    <span id="fwResultsLabel">0 works</span>
    <span>Click an image to open the full file.</span>
  </div>

  <section class="fw-gallery" id="fwGallery" aria-live="polite"></section>
  <div class="fw-empty-state" id="fwEmptyState">No pieces match that filter yet.</div>
</div>

<script>
  (function () {
    const root = document.getElementById("fw-gallery-root");
    if (!root) return;

    const manifestUrl = "https://juliayoussef.github.io/fourthwall/gallery.json";

    function titleFromFilename(filename) {
      const withoutExtension = filename.replace(/\.[^.]+$/, "");
      const cleaned = withoutExtension
        .replace(/[._-]+/g, " ")
        .replace(/\s+/g, " ")
        .replace(/\b(edited|reduced|resized|horizontal)\b/gi, "")
        .replace(/\s+/g, " ")
        .trim();

      return cleaned.replace(/\b\w/g, function (letter) {
        return letter.toUpperCase();
      });
    }

    function buildImageUrl(filename) {
      return "https://juliayoussef.github.io/fourthwall/gallery/" + encodeURIComponent(filename);
    }

    function normalizeItem(item, index) {
      item = item || {};
      const filename = item.filename || "";
      const title = item.title || titleFromFilename(filename) || filename;
      const defaults = {
        filename: filename,
        title: title,
        imageUrl: buildImageUrl(filename),
        alt: title + " artwork.",
        year: "",
        medium: "",
        caption: "",
        tags: [],
        show: true,
        featured: false,
        id: index + 1
      };

      return Object.assign({}, defaults, item, {
        filename: filename,
        imageUrl: buildImageUrl(filename),
        tags: Array.from(new Set((item.tags || []).map((tag) => String(tag).trim().toLowerCase()).filter(Boolean)))
      });
    }

    const filterBar = root.querySelector("#fwFilterBar");
    const gallery = root.querySelector("#fwGallery");
    const resultsLabel = root.querySelector("#fwResultsLabel");
    const emptyState = root.querySelector("#fwEmptyState");

    let normalizedItems = [];
    let tags = ["all"];
    let activeTag = "all";

    function formatTag(tag) {
      return tag.charAt(0).toUpperCase() + tag.slice(1);
    }

    function buildFilters() {
      filterBar.innerHTML = "";

      tags.forEach((tag) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "fw-filter-chip" + (tag === activeTag ? " is-active" : "");
        button.textContent = formatTag(tag);
        button.setAttribute("aria-pressed", String(tag === activeTag));
        button.addEventListener("click", function () {
          activeTag = tag;
          buildFilters();
          renderGallery();
        });
        filterBar.appendChild(button);
      });
    }

    function getFilteredItems() {
      if (activeTag === "all") return normalizedItems;
      return normalizedItems.filter((item) => item.tags.includes(activeTag));
    }

    function renderGallery() {
      const visibleItems = getFilteredItems();
      gallery.innerHTML = "";

      visibleItems.forEach((item, index) => {
        const article = document.createElement("article");
        article.className = "fw-card";
        article.style.animationDelay = (index * 55) + "ms";

        const link = document.createElement("a");
        link.className = "fw-card-link";
        link.href = item.imageUrl;
        link.target = "_blank";
        link.rel = "noreferrer";

        const image = document.createElement("img");
        image.className = "fw-card-media";
        image.src = item.imageUrl;
        image.alt = item.alt || item.title;
        link.appendChild(image);

        const body = document.createElement("div");
        body.className = "fw-card-body";

        if (item.featured) {
          const featured = document.createElement("p");
          featured.className = "fw-card-featured";
          featured.textContent = "Featured";
          body.appendChild(featured);
        }

        const title = document.createElement("h2");
        title.className = "fw-card-title";
        title.textContent = item.title;
        body.appendChild(title);

        const metaParts = [item.year, item.medium].filter(Boolean);
        if (metaParts.length) {
          const meta = document.createElement("p");
          meta.className = "fw-card-meta";
          meta.textContent = metaParts.join(" · ");
          body.appendChild(meta);
        }

        if (item.caption) {
          const caption = document.createElement("p");
          caption.className = "fw-card-caption";
          caption.textContent = item.caption;
          body.appendChild(caption);
        }

        const visibleTags = item.tags.filter((tag) => tag !== "all");
        if (visibleTags.length) {
          const tagsWrap = document.createElement("div");
          tagsWrap.className = "fw-card-tags";

          visibleTags.forEach((tag) => {
            const tagEl = document.createElement("span");
            tagEl.className = "fw-card-tag";
            tagEl.textContent = "#" + tag;
            tagsWrap.appendChild(tagEl);
          });

          body.appendChild(tagsWrap);
        }

        link.appendChild(body);
        article.appendChild(link);
        gallery.appendChild(article);
      });

      resultsLabel.textContent = visibleItems.length + " " + (visibleItems.length === 1 ? "work" : "works");
      emptyState.classList.toggle("is-visible", visibleItems.length === 0);
    }

    function setItems(items) {
      normalizedItems = items
        .map(normalizeItem)
        .filter((item) => item.filename && item.show !== false)
        .sort((a, b) => Number(Boolean(b.featured)) - Number(Boolean(a.featured)) || a.id - b.id);

      const tagSet = new Set(["all"]);
      normalizedItems.forEach((item) => item.tags.forEach((tag) => tagSet.add(tag)));
      tags = Array.from(tagSet);

      buildFilters();
      renderGallery();
    }

    fetch(manifestUrl)
      .then((response) => {
        if (!response.ok) {
          throw new Error("Gallery manifest failed to load.");
        }

        return response.json();
      })
      .then((items) => {
        setItems(Array.isArray(items) ? items : []);
      })
      .catch(() => {
        filterBar.innerHTML = "";
        gallery.innerHTML = "";
        resultsLabel.textContent = "0 works";
        emptyState.textContent = "The gallery could not be loaded right now.";
        emptyState.classList.add("is-visible");
      });
  }());
</script>
