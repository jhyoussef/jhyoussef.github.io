<!--
  Fourthwall custom code for the Membership tiers section only.
  Paste this inside the Membership tiers section custom code area.

  Goal:
  - add a highly compatible right-side image block
  - encourage the native membership content to flow on the left
  - avoid JavaScript and advanced selectors entirely

  Replace YOUR-IMAGE-URL-HERE with your real image URL.
-->

<style>
  #fw-mailclub-split {
    float: right;
    width: min(44%, 420px);
    margin: 0 0 1.5rem 2rem;
  }

  #fw-mailclub-split img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 22px;
  }

  #fw-mailclub-split .fw-mailclub-split-copy {
    margin-top: 0.9rem;
    text-align: left;
  }

  #fw-mailclub-split .fw-mailclub-split-copy h3 {
    margin: 0 0 0.5rem;
    font-size: 1.2rem;
    line-height: 1.1;
  }

  #fw-mailclub-split .fw-mailclub-split-copy p {
    margin: 0;
    line-height: 1.55;
  }

  #fw-mailclub-split + .fw-mailclub-clear {
    content: "";
    display: block;
    clear: both;
  }

  @media (max-width: 900px) {
    #fw-mailclub-split {
      float: none;
      width: 100%;
      max-width: 420px;
      margin: 0 auto 1.25rem;
    }
  }
</style>

<div id="fw-mailclub-split" class="fw-mailclub-split">
  <img src="YOUR-IMAGE-URL-HERE" alt="Mail Club preview image">
  <div class="fw-mailclub-split-copy">
    <h3>Inside the Mail Club</h3>
    <p>Letters, art, small extras, and behind-the-scenes notes from the studio.</p>
  </div>
</div>
<div class="fw-mailclub-clear"></div>
